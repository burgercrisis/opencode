preload = ["@opentui/solid/preload", "./test/preload.ts"]

# Exclude src/*/test/ files - they pollute global state (globalThis.Instance)
# causing "Instance.provide is not a function" errors in subsequent tests
# These tests also have fundamental design issues (mocking const values)
# The test/ directory tests work correctly
exclude = ["src/**/*.test.ts", "node_modules/**", "**/node_modules/**"]
